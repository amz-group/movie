      /* ===================== StarField ===================== */
      function StarField() {
        const canvasRef = useRef(null);
        const mouse = useRef({ x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 });

        useEffect(() => {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          let raf;
          let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
          let stars = [];
          let meteors = [];
          let lastMeteor = 0;

          const palette = ['#f5b942', '#fbbf24', '#fde68a', '#ffffff', '#fcd34d', '#fff7d6'];

          const init = () => {
            w = canvas.clientWidth;
            h = canvas.clientHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const count = Math.min(380, Math.floor((w * h) / 4200));
            stars = Array.from({ length: count }, () => ({
              x: Math.random() * w,
              y: Math.random() * h,
              z: Math.random() * 0.8 + 0.2,
              r: Math.random() * 1.4 + 0.3,
              tw: Math.random() * Math.PI * 2,
              tws: Math.random() * 0.02 + 0.005,
              vx: (Math.random() - 0.5) * 0.04 * (Math.random() * 0.5 + 0.5),
              vy: (Math.random() - 0.5) * 0.04 * (Math.random() * 0.5 + 0.5),
              c: palette[Math.floor(Math.random() * palette.length)],
            }));
          };

          const spawnMeteor = () => {
            const fromLeft = Math.random() > 0.5;
            meteors.push({
              x: fromLeft ? -50 : w + 50,
              y: Math.random() * h * 0.5,
              vx: (fromLeft ? 1 : -1) * (Math.random() * 4 + 6),
              vy: Math.random() * 3 + 2,
              life: 1,
              len: Math.random() * 80 + 80,
              c: palette[Math.floor(Math.random() * 3)],
            });
          };

          const onResize = () => init();
          const onMove = (e) => {
            mouse.current.tx = e.clientX / window.innerWidth;
            mouse.current.ty = e.clientY / window.innerHeight;
          };
          const onLeave = () => {
            mouse.current.tx = 0.5;
            mouse.current.ty = 0.5;
          };

          const render = (ts) => {
            mouse.current.x += (mouse.current.tx - mouse.current.x) * 0.06;
            mouse.current.y += (mouse.current.ty - mouse.current.y) * 0.06;
            const mx = (mouse.current.x - 0.5) * 2;
            const my = (mouse.current.y - 0.5) * 2;

            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < stars.length; i++) {
              const s = stars[i];
              s.tw += s.tws;
              s.x += s.vx;
              s.y += s.vy;
              if (s.x < 0) s.x = w;
              if (s.x > w) s.x = 0;
              if (s.y < 0) s.y = h;
              if (s.y > h) s.y = 0;

              const tw = (Math.sin(s.tw) + 1) * 0.5;
              const ox = -mx * 40 * s.z;
              const oy = -my * 40 * s.z;
              const x = s.x + ox;
              const y = s.y + oy;
              const alpha = (0.35 + tw * 0.65) * s.z;
              const radius = s.r * (0.7 + tw * 0.6) * s.z;

              ctx.globalAlpha = alpha;
              ctx.fillStyle = s.c;
              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fill();

              if (s.r > 1) {
                ctx.globalAlpha = alpha * 0.16;
                ctx.beginPath();
                ctx.arc(x, y, radius * 4.5, 0, Math.PI * 2);
                ctx.fill();
              }
            }

            ctx.globalAlpha = 1;
            ctx.lineWidth = 0.5;
            for (let i = 0; i < stars.length; i++) {
              const a = stars[i];
              if (a.r < 1) continue;
              const ax = a.x + -mx * 40 * a.z;
              const ay = a.y + -my * 40 * a.z;
              for (let j = i + 1; j < stars.length; j++) {
                const b = stars[j];
                if (b.r < 1) continue;
                const bx = b.x + -mx * 40 * b.z;
                const by = b.y + -my * 40 * b.z;
                const dx = ax - bx;
                const dy = ay - by;
                const d2 = dx * dx + dy * dy;
                if (d2 < 14000) {
                  ctx.globalAlpha = (1 - d2 / 14000) * 0.22;
                  ctx.strokeStyle = '#fbbf24';
                  ctx.beginPath();
                  ctx.moveTo(ax, ay);
                  ctx.lineTo(bx, by);
                  ctx.stroke();
                }
              }
            }

            if (ts - lastMeteor > 2600 && meteors.length < 2) {
              spawnMeteor();
              lastMeteor = ts;
            }
            for (let i = meteors.length - 1; i >= 0; i--) {
              const m = meteors[i];
              m.x += m.vx;
              m.y += m.vy;
              m.life -= 0.006;
              const tailX = m.x - (m.vx / Math.hypot(m.vx, m.vy)) * m.len;
              const tailY = m.y - (m.vy / Math.hypot(m.vx, m.vy)) * m.len;
              const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
              grad.addColorStop(0, `rgba(255,247,214,${m.life})`);
              grad.addColorStop(0.4, `rgba(251,191,36,${m.life * 0.6})`);
              grad.addColorStop(1, 'rgba(245,185,66,0)');
              ctx.globalAlpha = 1;
              ctx.strokeStyle = grad;
              ctx.lineWidth = 2;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(m.x, m.y);
              ctx.lineTo(tailX, tailY);
              ctx.stroke();
              ctx.globalAlpha = m.life;
              ctx.fillStyle = '#fff7d6';
              ctx.beginPath();
              ctx.arc(m.x, m.y, 1.8, 0, Math.PI * 2);
              ctx.fill();

              if (m.life <= 0 || m.x < -120 || m.x > w + 120 || m.y > h + 120) {
                meteors.splice(i, 1);
              }
            }

            ctx.globalAlpha = 1;
            raf = requestAnimationFrame(render);
          };

          init();
          raf = requestAnimationFrame(render);
          window.addEventListener('resize', onResize);
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseleave', onLeave);
          return () => {
            cancelAnimationFrame(raf);
            window.removeEventListener('resize', onResize);
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseleave', onLeave);
          };
        }, []);

        return (
          <canvas
            ref={canvasRef}
            className="absolute inset-0 w-full h-full pointer-events-none"
          />
        );
      }

      /* ===================== SunRays ===================== */
      function SunRays({ children, size = 260 }) {
        const rays = 21;
        return (
          <motion.div
            initial={{ opacity: 0, scale: 0.9, rotate: -8 }}
            animate={{ opacity: 1, scale: 1, rotate: 0 }}
            transition={{ duration: 0.9, ease: [0.22, 1, 0.36, 1] }}
            className="relative grid place-items-center"
            style={{ width: size, height: size }}
          >
            <motion.div
              animate={{ rotate: 360 }}
              transition={{ duration: 60, repeat: Infinity, ease: 'linear' }}
              className="absolute inset-0"
            >
              {Array.from({ length: rays }).map((_, i) => {
                const angle = (360 / rays) * i;
                return (
                  <div
                    key={i}
                    className="absolute left-1/2 top-1/2 origin-bottom"
                    style={{
                      width: 0,
                      height: 0,
                      transform: `translate(-50%, -100%) rotate(${angle}deg) translateY(-${size / 2 - 6}px)`,
                    }}
                  >
                    <div
                      className="w-[3px] rounded-full bg-gradient-to-t from-[#f5b942] via-[#fbbf24] to-transparent shadow-[0_0_10px_rgba(245,185,66,0.7)]"
                      style={{ height: 46 }}
                    />
                  </div>
                );
              })}
            </motion.div>

            <motion.div
              animate={{ rotate: -360 }}
              transition={{ duration: 90, repeat: Infinity, ease: 'linear' }}
              className="absolute inset-0"
            >
              {Array.from({ length: rays }).map((_, i) => {
                const angle = (360 / rays) * i + (360 / rays / 2);
                return (
                  <div
                    key={i}
                    className="absolute left-1/2 top-1/2 origin-bottom"
                    style={{
                      width: 0,
                      height: 0,
                      transform: `translate(-50%, -100%) rotate(${angle}deg) translateY(-${size / 2 - 10}px)`,
                    }}
                  >
                    <div
                      className="w-[1.5px] rounded-full bg-gradient-to-t from-[#fbbf24]/60 to-transparent"
                      style={{ height: 28 }}
                    />
                  </div>
                );
              })}
            </motion.div>

            <div
              className="absolute rounded-full blur-[40px] bg-[#f5b942]/25"
              style={{ width: size * 0.7, height: size * 0.7 }}
            />

            <div
              className="relative rounded-full p-[3px] bg-gradient-to-br from-[#f5b942] via-[#fbbf24] to-[#f5b942] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.55)] overflow-hidden"
              style={{ width: size * 0.62, height: size * 0.62 }}
            >
              <div className="w-full h-full rounded-full overflow-hidden bg-[#0a0d18] grid place-items-center">
                {children ?? (
                  <span className="font-extrabold text-white text-3xl tracking-tight">A</span>
                )}
              </div>
            </div>
          </motion.div>
        );
      }

        const clip =

        const sizing = fluid

        return (
          <motion.div
            initial={{ opacity: 0, rotate: -6, scale: 0.9 }}
            whileInView={{ opacity: 1, rotate: 0, scale: 1 }}
            viewport={{ once: true }}
            transition={{ duration: 0.5 }}
